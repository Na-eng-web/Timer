<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nakul & Geeta</title>
<meta name="description" content="Counting down to the wedding of Nakul & Geeta — 21 February 2027.">

<meta property="og:type" content="website">
<meta property="og:title" content="Nakul & Geeta — Wedding Countdown">
<meta property="og:description" content="Counting down to 21 February 2027, 12:31 PM IST.">
<meta property="og:url" content="https://na-eng-web.github.io/Timer/">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="petals" id="petals" aria-hidden="true"></div>

  <div class="wrap">
    <div class="eyebrow">Wedding Countdown</div>
    <h1>Nakul <span class="amp">&amp;</span> Geeta</h1>
    <div class="ornament" aria-hidden="true">❦</div>
    <div class="target-date" id="targetLabel"></div>

    <div class="stage">
      <div class="countdown" id="countdown">
        <div class="unit"><div class="value" id="months">00</div><div class="label">Months</div></div>
        <div class="sep" aria-hidden="true"></div>
        <div class="unit"><div class="value" id="days">00</div><div class="label">Days</div></div>
        <div class="sep" aria-hidden="true"></div>
        <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
        <div class="sep" aria-hidden="true"></div>
        <div class="unit"><div class="value" id="minutes">00</div><div class="label">Minutes</div></div>
        <div class="sep" aria-hidden="true"></div>
        <div class="unit"><div class="value" id="seconds">00</div><div class="label">Seconds</div></div>
      </div>
    </div>

    <div class="summary" id="summary"></div>
  </div>

<script src="script.js"></script>

</body>
</html>
