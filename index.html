<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narendra & Geeta</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #1a1a3d;
    --accent: #6ea8fe;
    --accent2: #a78bfa;
    --accent3: #34d399;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text: #f4f5f7;
    --muted: #9aa0b4;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    text-align: center;
    background: linear-gradient(160deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
    background-size: 300% 300%;
    animation: gradientShift 20s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap > * {
    animation: fadeInUp 0.8s ease both;
  }

  h1 { animation-delay: 0.05s; }
  .target-date { animation-delay: 0.15s; }
  .countdown { animation-delay: 0.25s; }
  .summary { animation-delay: 0.5s; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    color: var(--text);
  }

  .target-date {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 44px;
  }

  .countdown {
    display: flex;
    align-items: center;
    gap: clamp(3px, 1.5vw, 10px);
    flex-wrap: nowrap;
    justify-content: center;
    width: 100%;
    max-width: 560px;
  }

  .sep {
    flex: 0 0 auto;
    font-size: clamp(0.9rem, 3.5vw, 2rem);
    font-weight: 700;
    color: var(--muted);
  }

  .unit {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: clamp(10px, 3.5vw, 22px) clamp(4px, 2vw, 18px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .unit:hover {
    transform: translateY(-3px);
    border-color: rgba(110, 168, 254, 0.35);
  }

  .unit .value {
    position: relative;
    font-size: clamp(1.1rem, 6vw, 2.6rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    line-height: 1;
    display: inline-block;
  }

  .unit .value.bump {
    animation: bump 0.6s ease-in-out;
  }

  @keyframes bump {
    0% { opacity: 1; }
    50% { opacity: 0.82; }
    100% { opacity: 1; }
  }

  .unit .label {
    position: relative;
    margin-top: clamp(4px, 1.5vw, 8px);
    font-size: clamp(0.55rem, 2vw, 0.8rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .finished {
    font-size: 1.7rem;
    font-weight: 600;
    color: var(--accent);
    animation: fadeInUp 0.6s ease both;
  }

  .summary {
    margin-top: 30px;
    color: var(--muted);
    font-size: 1rem;
    max-width: 440px;
  }

  .summary strong {
    color: var(--text);
    font-weight: 700;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 340px) {
    .countdown { gap: 2px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="eyebrow">Wedding Countdown</div>
    <h1>Nakul &amp; Geeta</h1>
    <div class="target-date" id="targetLabel"></div>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="value" id="months">00</div><div class="label">Months</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="days">00</div><div class="label">Days</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <div class="summary" id="summary"></div>
  </div>

<script>
  // Target: 21 Feb 2027, 12:31 PM — interpreted in the viewer's local time.
  const targetDate = new Date(2027, 1, 21, 12, 31, 0);

  const targetLabel = document.getElementById("targetLabel");
  targetLabel.textContent = "Until " + targetDate.toLocaleString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric",
    hour: "numeric", minute: "2-digit"
  });

  const countdownEl = document.getElementById("countdown");
  const summaryEl = document.getElementById("summary");
  const monthsEl = document.getElementById("months");
  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  // Re-triggers the "bump" animation only on the tiles whose value actually changed.
  function setValue(el, text) {
    if (el.textContent === text) return;
    el.textContent = text;
    el.classList.remove("bump");
    void el.offsetWidth; // force reflow so the animation restarts
    el.classList.add("bump");
  }

  // Calendar-accurate breakdown: whole months first, then days/hours/min/sec
  // from whatever remains, so "1 month" always means one real calendar month.
  function breakdown(from, to) {
    let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    let marker = new Date(from);
    marker.setMonth(marker.getMonth() + months);
    if (marker > to) {
      months--;
      marker.setMonth(marker.getMonth() - 1);
    }

    let remainingMs = to - marker;
    const days = Math.floor(remainingMs / 86400000);
    remainingMs -= days * 86400000;
    const hours = Math.floor(remainingMs / 3600000);
    remainingMs -= hours * 3600000;
    const minutes = Math.floor(remainingMs / 60000);
    remainingMs -= minutes * 60000;
    const seconds = Math.floor(remainingMs / 1000);

    return { months, days, hours, minutes, seconds };
  }

  function tick() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      countdownEl.innerHTML = '<div class="finished">The moment has arrived.</div>';
      summaryEl.textContent = "";
      clearInterval(timer);
      return;
    }

    const { months, days, hours, minutes, seconds } = breakdown(now, targetDate);
    const totalSeconds = Math.floor(diff / 1000);
    const totalDays = Math.floor(diff / 86400000);

    setValue(monthsEl, pad(months));
    setValue(daysEl, pad(days));
    setValue(hoursEl, pad(hours));
    setValue(minutesEl, pad(minutes));
    setValue(secondsEl, pad(seconds));

    summaryEl.innerHTML =
      `<strong>${totalDays.toLocaleString()}</strong> days left &middot; ` +
      `<strong>${totalSeconds.toLocaleString()}</strong> seconds left`;
  }

  tick();
  const timer = setInterval(tick, 1000);
</script>

</body>
</html>
